{% from "bootstrap5/form.html" import render_form %}
{% include "_layout_open.html" %}

<div class="page-header">
    <div>
        <div class="page-kicker">Administration</div>
        <h1 class="page-title">Create asset</h1>
        <p class="page-subtitle">Add a new asset to the inventory, including optional documentation.</p>
    </div>
</div>

<div class="panel form-panel">
    <div class="panel-header">Asset details</div>
    <div class="panel-body">
        <form method="POST" enctype="multipart/form-data">
            {{ render_form(form) }}
        </form>
    </div>
</div>

{% include "_layout_close.html" %}
