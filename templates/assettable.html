<!-- DataTables CSS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<!-- DataTables JS -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<!-- DataTables with Bootstrap 5 styling -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>

<style>
    .status-bad {
        background-color: #f8d7da !important;
        color: #721c24 !important;
        font-weight: bold;
    }

    .status-warning {
        background-color: #fff3cd !important;
        color: #856404 !important;
        font-weight: bold;
    }

    .status-good {
        background-color: #d4edda !important;
        color: #155724 !important;
        font-weight: bold;
    }

    thead input, thead select {
        width: 100%;
        box-sizing: border-box;
    }

    #assetsTable tbody tr:hover {
        background-color: #f0f8ff; /* light blue highlight */
        cursor: pointer;
    }

    #assetsTable thead th:nth-child(7),
    #assetsTable tbody td:nth-child(7) {
        min-width: 12ch;
        white-space: nowrap;
    }
</style>







<table id="assetsTable" class="table table-striped table-bordered">
    <thead>
    <tr>
        <th>Asset SN</th>
        <th>Name</th>
        <th>Asset Group</th>
        <th>Description</th>
        <th>Location</th>
        <th>District</th>
        <th>Exp Date</th>
        <th>Status</th>
    </tr>
    <tr>
        <th><input type="text" placeholder="Filter SN" /></th>
        <th><input type="text" placeholder="Filter Name" /></th>
        <th><select><option value="">All</option></select></th>  <!-- Asset Group -->
        <th><input type="text" placeholder="Filter Description" /></th>
        <th><select><option value="">All</option></select></th>  <!-- Location -->
        <th><select><option value="">All</option></select></th>  <!-- District -->
        <th><select><option value="">All</option></select></th>  <!-- Exp Date -->
        <th><select><option value="">All</option></select></th>  <!-- Status -->
    </tr>
</thead>

    <tbody>
        {% for asset in all_assets %}
        <tr ondblclick="window.location.href='/asset/{{ asset.sn }}'">
            <td>{{ asset.sn }}</td>
            <td>{{ asset.name }}</td>
            <td>{{ asset.asset_group }}</td>
            <td>{{ asset.description }}</td>
            <td>{{ asset.location }}</td>
            <td>{{ asset.district }}</td>
            <td>{{ asset.expiration_date }}</td>
            <td>{{ asset.op_status }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script>
    $(document).ready(function () {
        const groupFilesInfoUrl = "{{ url_for('asset_group_files_info') }}";
        const groupFilesDownloadUrl = "{{ url_for('download_asset_group_files') }}";
        const assetGroupSelect = $('#assetsTable thead tr:eq(1) th').eq(2).find('select');
        let table;

        function updateGroupFilesButton() {
            const groupSelected = assetGroupSelect.val() !== '';
            table.button('.buttons-group-files').enable(groupSelected);
        }

        function downloadGroupFiles() {
            const assetGroup = assetGroupSelect.val();
            if (!assetGroup) {
                return;
            }

            $.getJSON(groupFilesInfoUrl, { asset_group: assetGroup })
                .done(function (data) {
                    const fileCount = data.file_count || 0;
                    if (fileCount === 0) {
                        window.alert('No uploaded files found for asset group "' + assetGroup + '".');
                        return;
                    }

                    const message = fileCount + ' file' + (fileCount === 1 ? '' : 's') +
                        ' will be downloaded for asset group "' + assetGroup + '".\n\nDo you want to continue?';

                    if (window.confirm(message)) {
                        window.location.href = groupFilesDownloadUrl +
                            '?asset_group=' + encodeURIComponent(assetGroup);
                    }
                })
                .fail(function () {
                    window.alert('Could not check files for the selected asset group. Please try again.');
                });
        }

        table = $('#assetsTable').DataTable({
            orderCellsTop: true,
            fixedHeader: true,
            responsive: true,
            pageLength: 25,
            dom: 'Bfrtip',
            buttons: [
                'copy',
                'csv',
                'excel',
                'pdf',
                {
                    text: 'Group Files (ZIP)',
                    className: 'buttons-group-files',
                    enabled: false,
                    action: function () {
                        downloadGroupFiles();
                    }
                }
            ],
            initComplete: function () {
                const api = this.api();

                api.columns().every(function (colIdx) {
                    const column = this;
                    const headerCell = $('#assetsTable thead tr:eq(1) th').eq(colIdx);
                    const input = headerCell.find('input');
                    const select = headerCell.find('select');

                    if (input.length) {
                        input.on('keyup change clear', function () {
                            if (column.search() !== this.value) {
                                column.search(this.value).draw();
                            }
                        });
                    }

                    if (select.length) {
                        let uniqueValues = new Set();

                        column.data().each(function (d) {
                            uniqueValues.add($('<div>').html(d).text().trim());
                        });

                        [...uniqueValues].sort().forEach(function (value) {
                            select.append('<option value="' + value + '">' + value + '</option>');
                        });

                        select.on('change', function () {
                            const val = $.fn.dataTable.util.escapeRegex($(this).val());
                            column.search(val ? '^' + val + '$' : '', true, false).draw();
                        });
                    }
                });

                assetGroupSelect.on('change', updateGroupFilesButton);
                updateGroupFilesButton();

                // Initial call to color status
                applyStatusColors();

                // Reapply colors after every redraw
                api.on('draw', applyStatusColors);
            }
        });

        function applyStatusColors() {
            $('#assetsTable tbody tr').each(function () {
                const statusCell = $(this).find('td').eq(7); // status is 8th column (index 7)
                const statusText = statusCell.text().trim().toLowerCase();

                statusCell.removeClass('status-bad status-warning status-good');

                if (statusText === 'bad') {
                    statusCell.addClass('status-bad');
                } else if (statusText === 'warning') {
                    statusCell.addClass('status-warning');
                } else if (statusText === 'good') {
                    statusCell.addClass('status-good');
                }
            });
        }
    });
</script>
