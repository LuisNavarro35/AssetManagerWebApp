{% from "bootstrap5/form.html" import render_form %}
{% include "_layout_open.html" %}

<div class="page-header">
    <div>
        <div class="page-kicker">Inventory</div>
        <h1 class="page-title">Edit asset</h1>
        <p class="page-subtitle">Update asset metadata and attached files.</p>
    </div>
</div>

<div class="panel form-panel">
    <div class="panel-header">Asset details</div>
    <div class="panel-body">
        <form method="POST" enctype="multipart/form-data">
            {{ render_form(form) }}
        </form>
    </div>
</div>

{% include "_layout_close.html" %}
