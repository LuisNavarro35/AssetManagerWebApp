<nav class="sb-topnav navbar navbar-expand app-topbar">
    <a class="navbar-brand" href="{{ url_for('home') }}">
        <span class="app-brand-mark"><i class="fas fa-layer-group"></i></span>
        Asset Manager
    </a>

    <button class="btn btn-link btn-sm order-1 order-lg-0 me-3" id="sidebarToggle" type="button" aria-label="Toggle navigation">
        <i class="fas fa-bars"></i>
    </button>

    <ul class="navbar-nav align-items-center">
        {% if current_user.is_authenticated %}
        <li class="nav-item">
            <span class="app-user-chip">
                {{ current_user.username }}
                <span class="app-user-avatar">{{ current_user.username[:1]|upper }}</span>
            </span>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
        </li>
        {% else %}
        <li class="nav-item">
            <a class="nav-link" href="{{ url_for('login') }}">Sign in</a>
        </li>
        {% endif %}
    </ul>

    <form class="d-none d-md-inline-block form-inline ms-auto me-0 my-2 app-search" role="search">
        <div class="input-group">
            <input class="form-control" type="text" placeholder="Search assets..." aria-label="Search" />
            <button class="btn btn-primary" id="btnNavbarSearch" type="button">
                <i class="fas fa-search"></i>
            </button>
        </div>
